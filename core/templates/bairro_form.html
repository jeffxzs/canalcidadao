{% extends 'base.html' %}
{% block titulo %}{% if editando %}Editar bairro{% else %}Novo bairro{% endif %} | Denúncias{% endblock %}
{% block conteudo %}
<h1>{% if editando %}Editar bairro{% else %}Novo bairro{% endif %}</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
    <a href="{% url 'bairro_lista' %}">Cancelar</a>
</form>
{% endblock %}
